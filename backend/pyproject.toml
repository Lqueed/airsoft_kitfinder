[project]
name = "airsoft-kitfinder-backend"
version = "0.1.0"
description = "Бэкенд airsoft_kitfinder: API каталога китов, парсеры магазинов"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "bcrypt>=4.0",
    "fastapi>=0.115",
    "greenlet>=3.5.3",
    "httpx>=0.28",
    "itsdangerous>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "selectolax>=0.3",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.11",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Миграции генерируются шаблоном Alembic — не линтим
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations (обязательные type hints)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
