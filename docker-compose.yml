# Dev-инфраструктура airsoft_kitfinder.
# PostgreSQL + MinIO (S3-совместимое хранилище фото китов).
# Backend/nginx добавятся на этапе M7 (продакшенизация).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kitfinder
      POSTGRES_PASSWORD: kitfinder
      POSTGRES_DB: kitfinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # S3-совместимое объектное хранилище (фото китов). Консоль — :9001, API — :9000.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Разовое создание бакета kit-images с публичным чтением (dev). После — завершается.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/kit-images &&
      mc anonymous set download local/kit-images &&
      echo 'bucket kit-images готов (public read)';
      "

volumes:
  pgdata:
  miniodata:
