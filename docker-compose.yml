# Dev-инфраструктура airsoft_kitfinder.
# В M0 — только PostgreSQL. Backend/nginx добавятся на этапе M7 (продакшенизация).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kitfinder
      POSTGRES_PASSWORD: kitfinder
      POSTGRES_DB: kitfinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
